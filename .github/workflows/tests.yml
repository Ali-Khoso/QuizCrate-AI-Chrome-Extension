name: QuizCrate tests
on:
  push:
  pull_request:
jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m pytest -q
        working-directory: server
  check-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check extension/app.js
      - run: node --check extension/demo-data.js
      - run: node --check extension/background.js
      - run: node --test extension/tests/*.test.cjs
      - run: python -m json.tool extension/manifest.json > /dev/null
